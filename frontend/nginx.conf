server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://images.unsplash.com http://localhost:1337 https://cms.cbz.co.zw; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 http://localhost:1337 https://*.cbz.co.zw https://api.cbz.co.zw https://cms.cbz.co.zw; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Image & Brand Asset Hotlink Protection
    location ~* \.(?:png|jpg|jpeg|gif|ico|webp|avif|svg)$ {
        valid_referers none blocked server_names localhost 127.0.0.1 *.cbz.co.zw cbz.co.zw cms.cbz.co.zw *.vercel.app *.railway.app;
        if ($invalid_referer) {
            return 403;
        }
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static assets with long-term cache (Scripts, Stylesheets, Fonts)
    location ~* \.(?:css|js|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Ensure index.html is not cached aggressively so new deployments are served immediately
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Block sensitive hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # SPA Routing Fallback: serve index.html for any requested path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

